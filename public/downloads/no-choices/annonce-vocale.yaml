annonce:
  alias: Annonce vocale
  icon: mdi:bullhorn
  mode: queued
  max: 5
  description: >-
    Diffuse un message parlé sur une ou plusieurs enceintes. Sur Sonos, l'annonce
    se superpose à la musique en cours via l'API AudioClip : le volume d'écoute
    de l'enceinte n'est PAS modifié, le champ `volume` ne règle que le clip.

  fields:
    message:
      name: Message
      description: Texte à prononcer.
      required: true
      example: "Sam, brosse tes dents."
      selector:
        text:
    piece:
      name: Pièce
      description: Où diffuser.
      default: toutes
      selector:
        select:
          options: [chambre, salon, toutes]
    volume:
      name: Volume du clip
      description: En pourcentage. N'affecte pas le volume d'écoute de l'enceinte.
      default: 45
      selector:
        number:
          min: 5
          max: 100
          step: 5
          unit_of_measurement: "%"
    nuit:
      name: Forcer la nuit
      description: Diffuser même pendant les heures calmes.
      default: false
      selector:
        boolean:

  sequence:
    - alias: "Heures calmes : on ne réveille personne sauf urgence"
      condition: template
      value_template: >-
        {{ (nuit | default(false)) or (today_at('07:00') <= now() <= today_at('21:45')) }}

    - variables:
        cibles: >-
          {% set p = piece | default('toutes') %}
          {% set table = {
               'chambre': ['media_player.sonos_chambre_enfant'],
               'salon': ['media_player.sonos_salon']
             } %}
          {% set toutes = ['media_player.sonos_chambre_enfant', 'media_player.sonos_salon'] %}
          {{ table.get(p, toutes) | select('has_value') | list }}

    - alias: "Aucune enceinte joignable : sortie silencieuse"
      condition: template
      value_template: "{{ cibles | count > 0 }}"

    - action: media_player.play_media
      target:
        entity_id: "{{ cibles }}"
      data:
        media_content_type: music
        media_content_id: >-
          media-source://tts/tts.piper?message={{ message | urlencode }}&language=fr_FR
        announce: true
        extra:
          volume: "{{ volume | default(45) }}"
