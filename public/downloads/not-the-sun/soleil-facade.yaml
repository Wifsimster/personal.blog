template:
  - binary_sensor:

      - name: "Soleil façade est"
        unique_id: soleil_facade_est
        icon: "{{ 'mdi:weather-sunny' if this.state == 'on' else 'mdi:weather-sunny-off' }}"
        state: >-
          {% set normale = 114 %}
          {% set el_min = 5 %}
          {% set ouverture = 65 %}
          {% set az = state_attr('sun.sun', 'azimuth') | float(-1) %}
          {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
          {% if az < 0 %}
            false
          {% else %}
            {# écart signé ramené dans [-180, 180] : gère le passage par le nord #}
            {% set ecart = ((az - normale + 540) % 360) - 180 %}
            {{ el > el_min and (ecart | abs) < ouverture }}
          {% endif %}
        attributes:
          azimut: "{{ state_attr('sun.sun', 'azimuth') }}"
          elevation: "{{ state_attr('sun.sun', 'elevation') }}"

      - name: "Soleil façade ouest"
        unique_id: soleil_facade_ouest
        icon: "{{ 'mdi:weather-sunny' if this.state == 'on' else 'mdi:weather-sunny-off' }}"
        state: >-
          {% set normale = 295 %}
          {% set el_min = 5 %}
          {% set ouverture = 65 %}
          {% set az = state_attr('sun.sun', 'azimuth') | float(-1) %}
          {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
          {% if az < 0 %}
            false
          {% else %}
            {% set ecart = ((az - normale + 540) % 360) - 180 %}
            {{ el > el_min and (ecart | abs) < ouverture }}
          {% endif %}
        attributes:
          azimut: "{{ state_attr('sun.sun', 'azimuth') }}"
          elevation: "{{ state_attr('sun.sun', 'elevation') }}"
