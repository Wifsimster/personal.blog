<title id="eimplem-t">Étape : Implémentation et tests</title>
<desc id="eimplem-d">Étape « Implémentation et tests ». Entrée : Mandat borné, contrat et espace isolé. Sortie : Code et tests, sur une branche dédiée, preuves ciblées et limites locales. Rôle : Avancer par tranches courtes, test d'abord, respecter les contrats, produire des preuves de comportement. Skills sélectionnables selon le travail : tdd, testing-patterns, coding-standards, verify. Pas de décision humaine ici ; escalade si le mandat ne suffit pas. En cas de refus : Test rouge, puis correction, puis test relancé.</desc>
