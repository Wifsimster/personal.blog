<title id="eimages-t">Étape : Images, déploiement et retour arrière</title>
<desc id="eimages-d">Étape « Images, déploiement et retour arrière ». Entrée : Changement fusionné, commit identifié. Sortie : Image à promouvoir ; circuit de promotion cible, déploiement à confirmer. Rôle : Construire une image immuable par commit, viser sa promotion telle quelle, savoir revenir en arrière. Procédures : procédures versionnées, workflows d'images, retour arrière. Aucun skill universel démontré à cette étape. Point humain : Un humain décide la promotion vers la production. En cas de refus : Échec constaté, puis retour arrière, puis image précédente.</desc>
