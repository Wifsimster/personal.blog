<title id="erevue-t">Étape : Revue indépendante</title>
<desc id="erevue-d">Étape « Revue indépendante ». Entrée : Tête exacte, CI verte, diff complet et preuves. Sortie : Verdict motivé, go sur cette tête, ou refus avec constats. Rôle : Contexte neuf, lecture complète du changement, conformité technique, sécurité et métier. Skills sélectionnables selon le travail : ade-review, code-review, security-review, business-compliance. Procédures : workflow de revue, mode preuve, service de revue de l'atelier. Humain sur conflit, décision absente ou publication manuelle ; une approbation exigée par le dépôt reste exigée. En cas de refus : Refus motivé, puis constats listés, puis boucle retry.</desc>
