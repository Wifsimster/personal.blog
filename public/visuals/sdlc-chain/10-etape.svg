<title id="equalif-t">Étape : Qualification et mise en service</title>
<desc id="equalif-d">Étape « Qualification et mise en service ». Entrée : Image déployée en recette, fonctionnalité encore fermée. Sortie : Mise en service à valider, ouverture après décision humaine. Rôle : Tester les parcours métier, vérifier les données, préparer l'ouverture progressive de la fonctionnalité. Skills sélectionnables selon le travail : manual-test-designer, qa-automation, verify. Point humain : Le responsable métier valide la mise en service ; une CI verte ne le remplace pas. En cas de refus : Écart métier, puis retour au besoin, puis nouvelle demande.</desc>
