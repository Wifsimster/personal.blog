<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="ebesoin-t ebesoin-d" lang="fr">
<title id="ebesoin-t">Étape : Besoin et issue</title>
<desc id="ebesoin-d">Étape « Besoin et issue ». Entrée : Demande brute, réunion, retour terrain ou incident, souvent incomplet. Sortie : Issue exploitable, problème, critères d'acceptation et décisions conservées. Rôle : Recueillir le besoin, garder les décisions, diagnostiquer, poser les questions qui manquent. Skills sélectionnables selon le travail : meeting-report, triage-issue, issue-review, grill-me. Point humain : Le demandeur tranche les ambiguïtés et confirme le besoin. En cas de refus : Question ouverte, puis précision demandée, puis issue complétée.</desc>
