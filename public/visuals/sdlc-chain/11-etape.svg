<title id="emesure-t">Étape : Mesure et entretien</title>
<desc id="emesure-d">Étape « Mesure et entretien ». Entrée : Historique de livraison, incidents, métriques. Sortie : Améliorations priorisées, qui redeviennent des besoins. Rôle : Mesurer la chaîne, analyser les incidents, entretenir le code et les tests. Skills sélectionnables selon le travail : parallel-audit, self-healing-tests, dup-unifier. Point humain : Un humain arbitre les priorités d'amélioration. Les améliorations retournent au début de la chaîne comme nouveaux besoins.</desc>
